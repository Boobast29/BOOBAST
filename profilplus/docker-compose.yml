services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: profilplus
      POSTGRES_PASSWORD: profilplus
      POSTGRES_DB: profilplus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profilplus"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://profilplus:profilplus@db:5432/profilplus?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "change-me-en-production"
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run start"
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
